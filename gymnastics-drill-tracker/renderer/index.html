<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        http-equiv="Content-Security-Policy"
        content="script-src 'self'"
    />
    <title>Drill Tracker</title>

    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
</head>
<body>


    
    <div id="drill_list_view">
        <h1>Gymnastics Drill Tracker</h1>

        <!-- alert -->
        <div id="drill_list_alert_container">
            
        </div>

        <!-- <div class="horizontal_label_input_container margin_bottom_2">
            
        </div> -->

        <div class="filter_container">
            <div class="label_container"><p>Filter by Events:</p></div>
            <div id="event_filter_buttons">
                
            </div>
        </div>
        <div class="filter_container margin_bottom_2">
            <div class="label_container"><p>Filter by Level:</p></div>
            <div id="level_filter_buttons">
                
            </div>
        </div>

        <div id="drill_list_controls">
            <div>
                <label for="name_search_input">
                    Filter by
                    <select id="text_search_type">
                        <option value="name">Name</option>
                        <option value="description">Description</option>
                        <option value="both">Name & Desc</option>
                    </select>
                </label>
                <input id="name_search_input" type="text">

                <div id="result_limit_container" class="horizontal_label_input_container">
                    <label id="result_limit_label" for="result_limit">Show Top:</label>
                    <input class="margin_left_5" id="result_limit" type="number" min="0" step="1">
                </div>
            </div>
            
            <div>
                <button id="randomize_order_button">Randomize Order</button>
                <button id="backup_button">Backup</button>
                <button id="add_drill_button">Add Drill</button>
            </div>
        </div>

        <div id="drill_list">
            <div class="drill">
                <div class="drill_header">
                    <div>
                        <h3 class="drill_name">This is a Drill</h3>
                        <div class="event_tags">
                            <button class="event_tag">Vault</button>
                            <button class="event_tag">Bar</button>
                        </div>
                    </div>
                    <div>
                        <button class="expand_button">Expand</button>
                        <div class="pin_button">
                            <img class="pin_hollow_image" src="../images/pin-hollow.svg" alt="Pin">
                            <img class="pin_filled_image" src="../images/pin-filled.svg" alt="Pinned" hidden>
                        </div>
                    </div>
                </div>
                <div class="drill_body" hidden>
                    <div>
                        <p class="drill_description">This is the description of the drill</p>
                        <p class="level_tags_label">Recommended Levels:</p>
                        <div class="level_tags">
                            <button class="level_tag">Tan</button>
                            <button class="level_tag">Bronze</button>
                            <button class="level_tag">Purple</button>
                        </div>
                    </div>
                    <div>
                        <button class="edit_button">Edit</button>
                    </div>
                </div>
            </div>

        </div>
    </div>






    <div id="add_edit_drill_view" hidden>
        <h1 id="add_edit_drill_header">Add/Edit Drill</h1>

        <!-- alert -->
        <div id="add_edit_drill_alert_container"></div>

        <div id="add_edit_form_div">
            <div class="form">
                <div class="horizontal_label_input_container">
                    <label id="input_drill_name_label" for="input_drill_name">Drill Name:</label>
                    <input type="text" id="input_drill_name">
                </div>
                <div>
                    <div class="label_container margin_botton_1">
                        <p>Events:</p>
                        <button class="inline_button" id="add_event_button">Add New</button>
                        <button class="inline_button" id="edit_events_button">Edit</button>
                    </div>
                    <div id="form_event_buttons">
                    </div>
                </div>
                <div>
                    <div class="label_container margin_botton_1">
                        <p>Recommended Levels:</p>
                        <button class="inline_button" id="add_level_button">Add New</button>
                        <button class="inline_button" id="edit_levels_button">Edit</button>
                    </div>
                    <div id="form_level_buttons">
                    </div>
                </div>
                <div>
                    <div class="label_container margin_botton_1"><label for="input_drill_description" class="form_label">Description:</label></div>
                    <textarea id="input_drill_description" rows="5"></textarea>
                </div>
            </div>
            <div class="form_buttons">
                <button id="add_edit_drill_submit">Create</button>
                <button id="return_button">Cancel</button>
                <button id="delete_drill_button">Delete</button>
            </div>
        </div>
    </div>

    <div id="add_edit_event_level_modal" hidden>
        <div class="modal_background">
            <div class="modal">
                <h3 class="modal_header">Add Event</h3>

                <p id="add_edit_tag_modal_alert_text" hidden></p>

                <div id="event_level_original_name_section" class="horizontal_label_input_container margin_bottom_2" hidden>
                    <label id="event_level_original_name_label" for="event_level_original_name">Level to Edit:</label>
                    <select name="" id="event_level_original_name">
                        <option value="">Default</option>
                    </select>
                </div>

                <div class="horizontal_label_input_container margin_bottom_2">
                    <label for="event_level_name">Name:</label>
                    <input type="text" id="event_level_name">
                </div>

                <div class="horizontal_label_input_container margin_bottom_2">
                    <label for="event_level_color">Color:</label>
                    <input type="color" id="event_level_color">
                </div>

                <div class="modal_buttons">
                    <button class="modal_yes_button">Create</button>
                    <button class="modal_no_button">Cancel</button>
                    <button id="delete_tag_button">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <div id="confirm_modal_outer_container" hidden>

    </div>

    <!-- load javascript -->
    <script src="./renderer.js" type="module"></script>
</body>
</html>
